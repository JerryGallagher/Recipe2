[package]
name = "recipe-website"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.14"
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
turso = "0.8.3"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
